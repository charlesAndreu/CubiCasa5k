<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Door editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/edit.css" />
  <link rel="stylesheet" href="/static/doors.css" />
</head>
<body>
  <header class="border-bottom bg-body-tertiary px-3 py-1 d-flex align-items-center justify-content-between">
    <h1 class="h6 mb-0">Door editor</h1>
    <a id="backToEditLink" href="/edit" class="btn btn-outline-secondary btn-sm">&larr; Back to wall editor</a>
  </header>

  <section class="bg-body-tertiary border-bottom px-3 py-2">
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button id="undoBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Undo</button>
      <button id="redoBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Redo</button>
      <button id="deleteBtn" type="button" class="btn btn-outline-danger btn-sm" disabled>Delete selected</button>
      <span class="d-flex align-items-center gap-1">
        <label for="widthInput" class="form-label small text-muted mb-0">Door width (px)</label>
        <input type="number" id="widthInput" class="form-control form-control-sm" min="2" step="1" style="width: 80px;" />
      </span>
      <button id="resetDoorsBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Reset to detected</button>
      <button id="resetViewBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Reset view</button>
      <button id="continueToGeoBtn" type="button" class="btn btn-primary btn-sm" disabled>Continue to export &rarr;</button>
      <span class="d-flex align-items-center gap-2 ms-auto">
        <span id="statusSpinner" class="spinner-border spinner-border-sm text-primary hidden" role="status" aria-hidden="true"></span>
        <span id="status" class="status small text-muted text-truncate"></span>
      </span>
    </div>
  </section>

  <main class="container-fluid py-2">
    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between gap-2">
        <span id="selectionCaption">No selection</span>
        <span class="zoom-hint text-muted small">double-click a wall to add a door &middot; drag a door to move it &middot; drag either end of a selected door to resize &middot; scroll to zoom, drag to pan</span>
      </div>
      <div class="img-wrap" id="canvasWrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </main>

  <script src="/static/doors.js"></script>
</body>
</html>
