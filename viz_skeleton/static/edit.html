<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wall graph editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/edit.css" />
  <link rel="stylesheet" href="/static/help.css" />
</head>
<body>
  <header class="border-bottom bg-body-tertiary px-3 py-1 d-flex align-items-center justify-content-between">
    <h1 class="h6 mb-0">Wall graph editor</h1>
    <a href="/" class="btn btn-outline-secondary btn-sm">&larr; Back to inference</a>
  </header>

  <section class="bg-body-tertiary border-bottom px-3 py-2">
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button id="undoBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Undo</button>
      <button id="redoBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Redo</button>
      <button id="deleteBtn" type="button" class="btn btn-outline-danger btn-sm" disabled>Delete selected</button>
      <button id="resetGraphBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Reset to original</button>
      <button id="dlEditedJson" type="button" class="btn btn-outline-secondary btn-sm" disabled>Download edited geometry (JSON)</button>
      <button id="resetViewBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>Reset view</button>
      <button id="magnetismBtn" type="button" class="btn btn-outline-primary btn-sm" aria-pressed="false">Magnetism: off</button>
      <button id="continueToGeoBtn" type="button" class="btn btn-primary btn-sm" disabled>Continue to doors &rarr;</button>
      <button id="helpBtn" type="button" class="btn btn-outline-secondary btn-sm" title="Keyboard & mouse shortcuts (?)" aria-expanded="false">?</button>
      <span class="d-flex align-items-center gap-2 ms-auto">
        <span id="statusSpinner" class="spinner-border spinner-border-sm text-primary hidden" role="status" aria-hidden="true"></span>
        <span id="status" class="status small text-muted text-truncate"></span>
      </span>
    </div>
  </section>

  <main class="container-fluid py-2">
    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between gap-2">
        <span id="selectionCaption">No selection</span>
        <span class="zoom-hint text-muted small">drag to select &middot; space-drag to pan &middot; ctrl-drag to draw &middot; <kbd>?</kbd> for shortcuts</span>
      </div>
      <div class="img-wrap" id="canvasWrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </main>

  <script src="/static/help.js"></script>
  <script src="/static/edit.js"></script>
</body>
</html>
