<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Georeference &amp; export</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/geo.css" />
</head>
<body>
  <header class="border-bottom bg-body-tertiary px-3 py-1 d-flex align-items-center justify-content-between">
    <h1 class="h6 mb-0">Georeference &amp; export</h1>
    <a href="/edit" class="btn btn-outline-secondary btn-sm">&larr; Back to editor</a>
  </header>

  <section class="bg-body-tertiary border-bottom px-3 py-2">
    <div class="d-flex flex-wrap align-items-end gap-2">
      <div>
        <label for="geocodeInput" class="form-label small text-muted mb-1">Search a place</label>
        <input type="text" id="geocodeInput" class="form-control form-control-sm" placeholder="e.g. 12 rue de Rivoli, Paris" style="width: 280px;" />
      </div>
      <div>
        <label class="form-label small text-muted mb-1">Or set lat / lon directly</label>
        <div class="d-flex gap-1">
          <input type="number" id="latInput" class="form-control form-control-sm" placeholder="lat" step="0.000001" style="width: 110px;" />
          <input type="number" id="lonInput" class="form-control form-control-sm" placeholder="lon" step="0.000001" style="width: 110px;" />
          <button id="useLatLonBtn" type="button" class="btn btn-outline-secondary btn-sm">Use</button>
        </div>
      </div>
      <span class="d-flex align-items-center gap-2 ms-auto">
        <span id="statusSpinner" class="spinner-border spinner-border-sm text-primary hidden" role="status" aria-hidden="true"></span>
        <span id="status" class="status small text-muted text-truncate"></span>
      </span>
      <div>
        <label for="levelNumberInput" class="form-label small text-muted mb-1">Level</label>
        <input type="number" id="levelNumberInput" class="form-control form-control-sm" value="0" step="1" style="width: 70px;" />
      </div>
      <button id="dlGeoJsonBtn" type="button" class="btn btn-primary btn-sm" disabled>Download GeoJSON</button>
    </div>
    <div id="geocodeResults" class="list-group mt-1 hidden" style="max-width: 500px;"></div>
  </section>

  <main class="container-fluid py-2">
    <div class="card">
      <div id="mapWrap"><div id="map"></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/geo.js"></script>
</body>
</html>
