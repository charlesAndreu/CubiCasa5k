<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CubiCasa5k — plan viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Floor plan viewer</h1>
    <p class="subtitle">Test-set presets or upload · model outputs · threshold post-proc</p>
  </header>

  <section class="controls">
    <fieldset class="source-fieldset">
      <legend>Input</legend>
      <label class="inline">
        <input type="radio" name="source" id="sourcePreset" value="preset" checked />
        Test set
      </label>
      <label class="inline">
        <input type="radio" name="source" id="sourceUpload" value="upload" />
        Upload
      </label>
    </fieldset>

    <label id="planLabel">
      Plan
      <select id="planSelect"></select>
    </label>

    <label id="uploadLabel" class="hidden">
      Image
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp" />
    </label>

    <label>
      Model
      <select id="modelSelect">
        <option value="">— checkpoint —</option>
      </select>
    </label>
    <label>
      Post-process
      <select id="postprocMode">
        <option value="legacy">Legacy (room/icon polygons, Manhattan)</option>
        <option value="wall">Wall graph (points + lines, any angle)</option>
      </select>
    </label>
    <label>
      Threshold
      <span class="thr-row">
        <input type="range" id="threshold" min="0.05" max="0.95" step="0.01" value="0.25" disabled />
        <output id="thresholdVal">0.25</output>
      </span>
    </label>
    <label id="axisBiasLabel" class="hidden">
      Axis bias (H/V strength)
      <span class="thr-row">
        <input type="range" id="axisBias" min="0" max="5" step="0.1" value="0.35" disabled />
        <output id="axisBiasVal">0.35</output>
      </span>
    </label>
    <label id="snapAlignLabel" class="hidden">
      Force alignment (snap, px offset allowed)
      <span class="thr-row">
        <input type="range" id="snapAlign" min="0" max="60" step="1" value="0" disabled />
        <output id="snapAlignVal">0 (off)</output>
      </span>
    </label>
    <label id="wallEvidenceLabel" class="hidden">
      Wall pixel evidence (from segmentation)
      <span class="thr-row">
        <input type="range" id="wallEvidence" min="0" max="1" step="0.05" value="0.9" disabled />
        <output id="wallEvidenceVal">0.90</output>
      </span>
    </label>
    <button id="runBtn" type="button" disabled>Run</button>
    <span id="status" class="status"></span>
  </section>

  <main class="grid">
    <figure class="panel row-main">
      <figcaption>Original plan</figcaption>
      <div class="img-wrap"><img id="imgInput" alt="Input floor plan" /></div>
    </figure>
    <figure class="panel row-main highlight">
      <figcaption id="postprocCaption">Post-proc combined</figcaption>
      <div class="img-wrap"><img id="imgPostproc" alt="Post-processed result" /></div>
    </figure>

    <figure class="panel row-seg">
      <figcaption>Room segmentation</figcaption>
      <div class="img-wrap"><img id="imgRoom" alt="Room segmentation" /></div>
    </figure>
    <figure class="panel row-seg">
      <figcaption>Icon segmentation</figcaption>
      <div class="img-wrap"><img id="imgIconSeg" alt="Icon segmentation" /></div>
    </figure>

    <figure class="panel row-seg">
      <figcaption>Room entropy</figcaption>
      <div class="img-wrap"><img id="imgRoomEntropy" alt="Room entropy" /></div>
    </figure>
    <figure class="panel row-seg">
      <figcaption>Icon entropy</figcaption>
      <div class="img-wrap"><img id="imgIconEntropy" alt="Icon entropy" /></div>
    </figure>

    <figure class="panel row-hm">
      <figcaption>Wall heatmaps (0–12)</figcaption>
      <div class="img-wrap"><img id="imgWall" alt="Wall heatmaps" /></div>
    </figure>
    <figure class="panel row-hm">
      <figcaption>Opening heatmaps (13–16)</figcaption>
      <div class="img-wrap"><img id="imgOpening" alt="Opening heatmaps" /></div>
    </figure>

    <figure class="panel row-hm span-2">
      <figcaption>Icon heatmaps (17–20)</figcaption>
      <div class="img-wrap"><img id="imgIconHm" alt="Icon heatmaps" /></div>
    </figure>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
