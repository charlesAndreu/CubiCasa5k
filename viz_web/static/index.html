<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CubiCasa5k — plan viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Floor plan viewer</h1>
    <p class="subtitle">30 test plans · heatmaps &amp; seg · threshold post-proc</p>
  </header>

  <section class="controls">
    <label>
      Plan
      <select id="planSelect"></select>
    </label>
    <label>
      Model
      <select id="modelSelect">
        <option value="">— checkpoint —</option>
      </select>
    </label>
    <label>
      Threshold
      <span class="thr-row">
        <input type="range" id="threshold" min="0.05" max="0.95" step="0.01" value="0.25" disabled />
        <output id="thresholdVal">0.25</output>
      </span>
    </label>
    <button id="runBtn" type="button" disabled>Run</button>
    <span id="status" class="status"></span>
  </section>

  <main class="grid">
    <!-- row 1: original | post-proc -->
    <figure class="panel row-main">
      <figcaption>Original plan</figcaption>
      <div class="img-wrap"><img id="imgInput" alt="Original plan" /></div>
    </figure>
    <figure class="panel row-main highlight">
      <figcaption>Post-proc combined</figcaption>
      <div class="img-wrap"><img id="imgPostproc" alt="Post-processed combined" /></div>
    </figure>

    <!-- row 2: room | icon seg -->
    <figure class="panel row-seg">
      <figcaption>Room segmentation</figcaption>
      <div class="img-wrap"><img id="imgRoom" alt="Room segmentation" /></div>
    </figure>
    <figure class="panel row-seg">
      <figcaption>Icon segmentation</figcaption>
      <div class="img-wrap"><img id="imgIconSeg" alt="Icon segmentation" /></div>
    </figure>

    <!-- row 3: wall | opening HM -->
    <figure class="panel row-hm">
      <figcaption>Wall heatmaps (0–12)</figcaption>
      <div class="img-wrap"><img id="imgWall" alt="Wall heatmaps" /></div>
    </figure>
    <figure class="panel row-hm">
      <figcaption>Opening heatmaps (13–16)</figcaption>
      <div class="img-wrap"><img id="imgOpening" alt="Opening heatmaps" /></div>
    </figure>

    <!-- row 4: icon HM (full width) -->
    <figure class="panel row-hm span-2">
      <figcaption>Icon heatmaps (17–20)</figcaption>
      <div class="img-wrap"><img id="imgIconHm" alt="Icon heatmaps" /></div>
    </figure>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
